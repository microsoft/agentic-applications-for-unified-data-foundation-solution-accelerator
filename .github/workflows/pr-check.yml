name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-check:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Confirm workflow triggered
        run: echo "Pull request #${{ github.event.pull_request.number }} triggered this workflow on branch ${{ github.head_ref }}."
